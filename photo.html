<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Photos – Adriana Calahorra-Oliart</title>

<link rel="stylesheet" href="a_styles.css">
<link rel="stylesheet" href="sidebar.css">

<style>

/* DO NOT TOUCH SIDEBAR → just align content */
.content {
  max-width: 900px;
}

/* ===== SIMPLE MASONRY (NO GRID BREAKING) ===== */
.photo-grid {
  column-count: 3;
  column-gap: 30px;
}

/* images */
.photo-grid img {
  width: 100%;
  height: auto;
  margin-bottom: 30px;
  display: block;
  break-inside: avoid;
}

/* slight variation (editorial feel, but safe) */
.photo-grid img:nth-child(2),
.photo-grid img:nth-child(6) {
  width: 85%;
}

.photo-grid img:nth-child(4) {
  width: 70%;
}

/* ===== MOBILE ===== */
@media (max-width: 700px) {

  body {
    margin-left: 0;
  }

  .content {
    padding: 20px;
    max-width: 100%;
  }

  .photo-grid {
    column-count: 1;
  }

  .photo-grid img {
    width: 100%;
  }
}

</style>

</head>

<body>

<div id="sidebar"></div>

<script>
fetch("sidebar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("sidebar").innerHTML = html;
  });
</script>

<div class="content">

  <div class="photo-grid">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
    <img src="photo9.jpg">
  </div>

</div>

</body>
</html>
