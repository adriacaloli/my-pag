<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Photos – Adriana Calahorra-Oliart</title>

<!-- FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<!-- GLOBAL STYLES -->
<link rel="stylesheet" href="a_styles.css">
<link rel="stylesheet" href="sidebar.css">

<style>

/* ===== PAGE WIDTH (wider than text pages) ===== */
.content {
  max-width: 900px;
}

/* ===== EDITORIAL FLOW (NO GRID) ===== */
.photo-grid {
  display: flex;
  flex-direction: column;
  gap: 80px;

  max-width: 900px;
  margin-left: 0; /* aligns with your content column */
}

/* BASE IMAGE */
.photo-grid img {
  width: 60%;
  height: auto;
  display: block;
  border-radius: 0; /* no rounded corners */
}

/* ===== CONTROLLED OFFSETS ===== */

.photo-grid img:nth-child(2) {
  margin-left: 120px;
}

.photo-grid img:nth-child(3) {
  width: 75%;
}

.photo-grid img:nth-child(4) {
  width: 40%;
  margin-left: 200px;
}

.photo-grid img:nth-child(5) {
  width: 55%;
}

.photo-grid img:nth-child(6) {
  margin-left: 150px;
}

.photo-grid img:nth-child(7) {
  width: 80%;
}

.photo-grid img:nth-child(8) {
  width: 35%;
  margin-left: 220px;
}

.photo-grid img:nth-child(9) {
  width: 60%;
}

/* ===== MOBILE ===== */
@media (max-width: 700px) {

  body {
    margin-left: 0;
  }

  .content {
    max-width: 100%;
    margin-left: 0;
    padding: 20px;
  }

  .photo-grid {
    gap: 40px;
  }

  .photo-grid img {
    width: 100% !important;
    margin-left: 0 !important;
  }

}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar"></div>

<script>
fetch("sidebar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("sidebar").innerHTML = html;
  });
</script>

<!-- CONTENT -->
<div class="content">

  <h1></h1>

  <div class="photo-grid">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
    <img src="photo9.jpg">
  </div>

</div>

</body>
</html>
