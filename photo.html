<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Photos – Adriana Calahorra-Oliart</title>

<!-- FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<!-- GLOBAL -->
<link rel="stylesheet" href="a_styles.css">
<link rel="stylesheet" href="sidebar.css">

<style>

/* PHOTO PAGE */

.photo-gallery {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  padding: 40px 0 100px;
}

.photo-gallery img {
  display: block;

  /* SAME WIDTH FOR EVERY PHOTO */
  width: 100%;

  /* HEIGHT FOLLOWS ORIGINAL PHOTO PROPORTIONS */
  height: auto;

  /* SPACE BETWEEN PHOTOS */
  margin-bottom: 55px;
}


/* MOBILE */

@media (max-width: 700px) {

  body {
    margin-left: 0;
  }

  .content {
    padding: 20px;
  }

  .photo-gallery {
    width: 100%;
    padding: 10px 0 50px;
  }

  .photo-gallery img {
    width: 100%;
    height: auto;
    margin-bottom: 30px;
  }

}

</style>

</head>


<body>

<!-- SIDEBAR -->

<div id="sidebar"></div>

<script>
fetch("sidebar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("sidebar").innerHTML = html;
  });
</script>


<!-- CONTENT -->

<div class="content">
  
  <h1></h1>

  <p>
    I really enjoy shooting photos with disposable cameras and "imperfect" ones like my Holga. I find there's something charming in the surprising movement and the light leaks. 
  </p>

  <div class="photo-gallery">

    <img src="photo1.jpg" alt="">
    <img src="photo2.jpg" alt="">
    <img src="photo3.jpg" alt="">
    <img src="photo4.jpg" alt="">
    <img src="photo5.jpg" alt="">
    <img src="photo6.jpg" alt="">
    <img src="photo7.jpg" alt="">
    <img src="photo8.jpg" alt="">
    <img src="photo9.jpg" alt="">

  </div>

</div>

</body>
</html>
