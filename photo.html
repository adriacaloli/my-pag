<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Photos – Adriana Calahorra-Oliart</title>

<!-- FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<!-- GLOBAL -->
<link rel="stylesheet" href="a_styles.css">
<link rel="stylesheet" href="sidebar.css">

<style>

/* ===== WIDTH ===== */
.content {
  max-width: 1000px;
}

/* ===== PROPORTIONAL GRID ===== */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 160px;   /* ← MASTER UNIT */
  gap: 20px;
}

/* ===== IMAGES ===== */
.photo-grid img {
  width: 100%;
  height: 100%;
  object-fit: contain;  /* NEVER crop */
  display: block;
}

/* ===== SIZE SYSTEM ===== */
/* SMALL = 2x2 */
/* LARGE = 4x4 */
/* HORIZONTAL = 4x2 */
/* VERTICAL = 2x4 */

/* BIG */
.photo1 {
  grid-column: span 4;
  grid-row: span 4;
}

/* SMALL */
.photo2 {
  grid-column: span 2;
  grid-row: span 2;
}

.photo3 {
  grid-column: span 2;
  grid-row: span 2;
}

/* HORIZONTAL (same height as 2 small stacked) */
.photo4 {
  grid-column: span 4;
  grid-row: span 2;
}

/* VERTICAL (same height as big split) */
.photo5 {
  grid-column: span 2;
  grid-row: span 4;
}

/* SMALL */
.photo6 {
  grid-column: span 2;
  grid-row: span 2;
}

.photo7 {
  grid-column: span 2;
  grid-row: span 2;
}

/* BIG */
.photo8 {
  grid-column: span 4;
  grid-row: span 4;
}

/* SMALL */
.photo9 {
  grid-column: span 2;
  grid-row: span 2;
}

/* ===== MOBILE ===== */
@media (max-width: 700px) {

  body {
    margin-left: 0;
  }

  .content {
    max-width: 100%;
    padding: 20px;
  }

  .photo-grid {
    display: block;
  }

  .photo-grid img {
    width: 100%;
    height: auto;
    margin-bottom: 20px;
  }
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar"></div>
<script>
fetch("sidebar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("sidebar").innerHTML = html;
  });
</script>

<!-- CONTENT -->
<div class="content">

  <div class="photo-grid">
    <img src="photo1.jpg" class="photo1">
    <img src="photo2.jpg" class="photo2">
    <img src="photo3.jpg" class="photo3">
    <img src="photo4.jpg" class="photo4">
    <img src="photo5.jpg" class="photo5">
    <img src="photo6.jpg" class="photo6">
    <img src="photo7.jpg" class="photo7">
    <img src="photo8.jpg" class="photo8">
    <img src="photo9.jpg" class="photo9">
  </div>

</div>

</body>
</html>
