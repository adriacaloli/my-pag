<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Photos – Adriana Calahorra-Oliart</title>

<link rel="stylesheet" href="a_styles.css">
<link rel="stylesheet" href="sidebar.css">

<style>

/* keep alignment with sidebar */
.content {
  max-width: 1000px;
}

/* editorial grid */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
}

/* images */
.photo-grid img {
  width: 100%;
  height: auto;
  display: block;
}

/* layout */
.photo1 { grid-column: span 7; }
.photo2 { grid-column: span 5; }
.photo3 { grid-column: span 6; }
.photo4 { grid-column: span 3; }
.photo5 { grid-column: span 3; }
.photo6 { grid-column: span 8; }
.photo7 { grid-column: span 4; }
.photo8 { grid-column: span 7; }
.photo9 { grid-column: span 5; }

/* mobile */
@media (max-width: 700px) {

  body {
    margin-left: 0;
  }

  .content {
    padding: 20px;
    max-width: 100%;
  }

  .photo-grid {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<div id="sidebar"></div>

<script>
fetch("sidebar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("sidebar").innerHTML = html;
  });
</script>

<div class="content">

  <div class="photo-grid">
    <img src="photo1.jpg" class="photo1">
    <img src="photo2.jpg" class="photo2">
    <img src="photo3.jpg" class="photo3">
    <img src="photo4.jpg" class="photo4">
    <img src="photo5.jpg" class="photo5">
    <img src="photo6.jpg" class="photo6">
    <img src="photo7.jpg" class="photo7">
    <img src="photo8.jpg" class="photo8">
    <img src="photo9.jpg" class="photo9">
  </div>

</div>

</body>
</html>
