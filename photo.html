<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Photos – Adriana Calahorra-Oliart</title>

<!-- FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<!-- GLOBAL STYLES -->
<link rel="stylesheet" href="a_styles.css">
<link rel="stylesheet" href="sidebar.css">

<style>
/* ONLY page-specific tweak */

/* wider gallery than text pages */
.content {
  max-width: 800px;
}

/* ===== CLEAN EDITORIAL GRID (STRICT SYSTEM) ===== */

.photo-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 140px;   /* master unit */
  gap: 20px;
}

/* BASE IMAGE */
.photo-grid img {
  width: 100%;
  height: 100%;
  object-fit: contain;   /* no cropping EVER */
  display: block;
  border-radius: 0;      /* ← removed rounded corners */
}

/* ===== STRICT SCALE SYSTEM ===== */
/* only 2 sizes: 2 units or 4 units */

/* LARGE (4x4) */
.photo-grid img:nth-child(1) {
  grid-column: span 4;
  grid-row: span 4;
}

/* SMALL (2x2) */
.photo-grid img:nth-child(2) {
  grid-column: span 2;
  grid-row: span 2;
}

.photo-grid img:nth-child(3) {
  grid-column: span 2;
  grid-row: span 2;
}

.photo-grid img:nth-child(4) {
  grid-column: span 2;
  grid-row: span 2;
}

/* LARGE */
.photo-grid img:nth-child(5) {
  grid-column: span 4;
  grid-row: span 4;
}

/* SMALL */
.photo-grid img:nth-child(6) {
  grid-column: span 2;
  grid-row: span 2;
}

.photo-grid img:nth-child(7) {
  grid-column: span 2;
  grid-row: span 2;
}

/* LARGE */
.photo-grid img:nth-child(8) {
  grid-column: span 4;
  grid-row: span 4;
}

/* SMALL */
.photo-grid img:nth-child(9) {
  grid-column: span 2;
  grid-row: span 2;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar"></div>

<script>
fetch("sidebar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("sidebar").innerHTML = html;
  });
</script>

<!-- CONTENT -->
<div class="content">

  <h1></h1>

  <div class="photo-grid">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
    <img src="photo9.jpg">
  </div>

</div>

</body>
</html>
