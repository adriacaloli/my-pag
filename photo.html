<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Photos – Adriana Calahorra-Oliart</title>

<!-- FONTS (IMPORTANT: matches other pages) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<!-- GLOBAL -->
<link rel="stylesheet" href="a_styles.css">
<link rel="stylesheet" href="sidebar.css">

<style>

/* DO NOT TOUCH layout system */
/* only photo styling below */

/* clean editorial column layout */
/* EDITORIAL PHOTO LAYOUT */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  column-gap: 24px;
  row-gap: 36px;
  align-items: start;
}

.photo-grid img {
  width: 100%;
  height: auto;
  display: block;
}

/* larger, more coherent rhythm */

.photo-grid img:nth-child(1) {
  grid-column: 1 / 8;
}

.photo-grid img:nth-child(2) {
  grid-column: 8 / 13;
  margin-top: 40px;
}

.photo-grid img:nth-child(3) {
  grid-column: 2 / 7;
}

.photo-grid img:nth-child(4) {
  grid-column: 7 / 13;
}

.photo-grid img:nth-child(5) {
  grid-column: 1 / 6;
}

.photo-grid img:nth-child(6) {
  grid-column: 6 / 13;
  margin-top: 30px;
}

.photo-grid img:nth-child(7) {
  grid-column: 2 / 9;
}

.photo-grid img:nth-child(8) {
  grid-column: 8 / 13;
  margin-top: 50px;
}

.photo-grid img:nth-child(9) {
  grid-column: 1 / 7;
}


/* MOBILE */
@media (max-width: 700px) {

  body {
    margin-left: 0;
  }

  .content {
    padding: 20px;
  }

  .photo-grid {
    display: block;
  }

  .photo-grid img {
    width: 100%;
    margin: 0 0 24px 0;
  }
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar"></div>

<script>
fetch("sidebar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("sidebar").innerHTML = html;
  });
</script>

<!-- CONTENT -->
<div class="content">

  <div class="photo-grid">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
    <img src="photo9.jpg">
  </div>

</div>

</body>
</html>
