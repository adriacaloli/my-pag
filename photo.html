<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Photos – Adriana Calahorra-Oliart</title>

<!-- FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap"
  rel="stylesheet">

<link
  href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap"
  rel="stylesheet">

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
  rel="stylesheet">


<!-- GLOBAL -->
<link rel="stylesheet" href="a_styles.css">
<link rel="stylesheet" href="sidebar.css">


<style>

/* =========================================================
   PHOTO PAGE
   ========================================================= */

.photo-page {
  width: 100%;
  max-width: 1150px;
  margin: 0 auto;
  padding: 30px 35px 100px;
  box-sizing: border-box;
}


/* =========================================================
   PHOTO LAYOUT
   ========================================================= */

.photo-layout {
  display: flex;
  flex-direction: column;
  gap: 55px;
}


/* GENERAL */

.photo-line {
  display: flex;
  width: 100%;
  box-sizing: border-box;
}

.photo-line img {
  display: block;
  height: auto;
  object-fit: contain;
  flex: none;
}


/* =========================================================
   LINE 1
   big left / smaller right
   ========================================================= */

.line-1 {
  justify-content: space-between;
  align-items: flex-start;
}

.line-1 .photo1 {
  width: clamp(360px, 55%, 610px);
}

.line-1 .photo2 {
  width: clamp(210px, 28%, 315px);
  margin-top: 70px;
}


/* =========================================================
   LINE 2
   smaller left / big right
   ========================================================= */

.line-2 {
  justify-content: space-between;
  align-items: center;
  padding: 0 4%;
}

.line-2 .photo3 {
  width: clamp(260px, 34%, 380px);
}

.line-2 .photo4 {
  width: clamp(330px, 45%, 500px);
}


/* =========================================================
   LINE 3
   one big central image
   ========================================================= */

.line-3 {
  justify-content: center;
}

.line-3 .photo5 {
  width: clamp(480px, 66%, 720px);
}


/* =========================================================
   LINE 4
   uneven pair
   ========================================================= */

.line-4 {
  justify-content: space-between;
  align-items: flex-end;
}

.line-4 .photo6 {
  width: clamp(300px, 40%, 450px);
  margin-left: 5%;
}

.line-4 .photo7 {
  width: clamp(230px, 30%, 340px);
  margin-right: 4%;
  margin-bottom: 60px;
}


/* =========================================================
   LINE 5
   large left / medium right
   ========================================================= */

.line-5 {
  justify-content: space-between;
  align-items: flex-start;
}

.line-5 .photo8 {
  width: clamp(400px, 55%, 610px);
}

.line-5 .photo9 {
  width: clamp(250px, 33%, 370px);
  margin-top: 100px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

  body {
    margin-left: 0;
  }

  .content {
    padding: 0;
  }

  .photo-page {
    padding: 20px 18px 60px;
  }

  .photo-layout {
    gap: 24px;
  }

  .photo-line {
    display: block;
    padding: 0;
  }

  .photo-line img,
  .line-1 .photo1,
  .line-1 .photo2,
  .line-2 .photo3,
  .line-2 .photo4,
  .line-3 .photo5,
  .line-4 .photo6,
  .line-4 .photo7,
  .line-5 .photo8,
  .line-5 .photo9 {

    width: 100%;
    margin: 0 0 24px 0;
  }

}

</style>

</head>


<body>


<!-- SIDEBAR -->
<div id="sidebar"></div>

<script>
fetch("sidebar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("sidebar").innerHTML = html;
  });
</script>


<!-- CONTENT -->
<div class="content">

  <div class="photo-page">

    <div class="photo-layout">


      <!-- LINE 1 -->

      <div class="photo-line line-1">

        <img
          class="photo1"
          src="photo1.jpg"
          alt="">

        <img
          class="photo2"
          src="photo2.jpg"
          alt="">

      </div>


      <!-- LINE 2 -->

      <div class="photo-line line-2">

        <img
          class="photo3"
          src="photo3.jpg"
          alt="">

        <img
          class="photo4"
          src="photo4.jpg"
          alt="">

      </div>


      <!-- LINE 3 -->

      <div class="photo-line line-3">

        <img
          class="photo5"
          src="photo5.jpg"
          alt="">

      </div>


      <!-- LINE 4 -->

      <div class="photo-line line-4">

        <img
          class="photo6"
          src="photo6.jpg"
          alt="">

        <img
          class="photo7"
          src="photo7.jpg"
          alt="">

      </div>


      <!-- LINE 5 -->

      <div class="photo-line line-5">

        <img
          class="photo8"
          src="photo8.jpg"
          alt="">

        <img
          class="photo9"
          src="photo9.jpg"
          alt="">

      </div>


    </div>

  </div>

</div>


</body>
</html>
