<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skateboarding – Adriana Calahorra-Oliart</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

  <!-- SHARED STYLES -->
  <link rel="stylesheet" href="a_styles.css">

  <!-- SIDEBAR -->
  <link rel="stylesheet" href="sidebar.css">

  <style>
    /* ===== PAGE-SPECIFIC ONLY ===== */

    .photo-vertical img {
      width: 100%;
      max-width: 600px;
      display: block;
      margin: 40px auto 0 auto;
      border-radius: 8px;
    }

    .section {
      max-width: 900px;
    }

    h1 {
      margin-top: 0;
      font-size: 3rem;
    }

    h2 {
      font-size: 1.8rem;
      margin-top: 40px;
    }

    /* VIDEO */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      margin-top: 20px;
      margin-bottom: 40px;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* MOBILE */
    @media (max-width: 700px) {

      .content {
        padding: 20px;
      }

      .photo-vertical img {
        margin: 20px 0;
      }

      h1 {
        font-size: 2.2rem;
      }

      h2 {
        font-size: 1.4rem;
      }

    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div id="sidebar"></div>
  <script>
    fetch("sidebar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("sidebar").innerHTML = html;
      });
  </script>

  <!-- CONTENT -->
  <div class="content">

    <!-- IMAGE -->
<img src="skatephoto_r.jpg" class="banner">


    <!-- TEXT -->
    <div class="section">

      <h1>Skateboarding</h1>

      <p>I've been skateboarding since 2003.</p>

      <h2>My videopart</h2>

      <div class="video-wrapper">
        <iframe src="https://www.youtube-nocookie.com/embed/VbYhs36milQ" allowfullscreen></iframe>
      </div>

      <h2>Barcelona Summer 2025</h2>

      <div class="video-wrapper">
        <iframe src="https://www.youtube-nocookie.com/embed/cvqFCiELD1U" allowfullscreen></iframe>
      </div>

    </div>

  </div>

</body>
</html>
