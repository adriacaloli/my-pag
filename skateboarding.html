<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skateboarding – Adriana Calahorra-Oliart</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

  <!-- SHARED STYLES -->
  <link rel="stylesheet" href="a_styles.css">
  <link rel="stylesheet" href="sidebar.css">

  <style>
    /* ===== SAME BASE AS WORKING PAGES ===== */
    body {
      margin: 0;
      background-color: #d0e8d0;
      font-family: 'Space Grotesk', sans-serif;
      color: #111;
      margin-left: 180px;
    }

    .content {
      padding: 60px 8vw;
    }

    /* ===== HERO IMAGE (Panna style) ===== */
    .banner {
      width: 100%;
      max-width: 1100px;
      display: block;
      margin: 0 auto 50px auto;
      border-radius: 12px;
    }

    /* ===== TEXT BLOCK ===== */
    .section {
      max-width: 750px;
    }

    h1 {
      margin-top: 0;
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -1px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.4rem;
      margin-top: 50px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* ===== VIDEO (clean centered blocks) ===== */
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 750px;
      margin: 20px 0 50px 0;
      padding-top: 56.25%;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 700px) {

      body {
        margin-left: 0;
      }

      .content {
        padding: 20px;
      }

      .banner {
        margin-bottom: 30px;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.2rem;
        margin-top: 30px;
      }

      .video-wrapper {
        margin-bottom: 30px;
      }

    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div id="sidebar"></div>
  <script>
    fetch("sidebar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("sidebar").innerHTML = html;
      });
  </script>

  <!-- CONTENT -->
  <div class="content">

    <!-- IMAGE -->
    <img src="skatephoto_r.jpg" class="banner">

    <!-- TEXT -->
    <div class="section">

      <h1>Skateboarding</h1>

      <p>I've been skateboarding since 2003.</p>

      <h2>My videopart</h2>

      <div class="video-wrapper">
        <iframe src="https://www.youtube-nocookie.com/embed/VbYhs36milQ" allowfullscreen></iframe>
      </div>

      <h2>Barcelona Summer 2025</h2>

      <div class="video-wrapper">
        <iframe src="https://www.youtube-nocookie.com/embed/cvqFCiELD1U" allowfullscreen></iframe>
      </div>

    </div>

  </div>

</body>
</html>
