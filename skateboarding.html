<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skateboarding – Adriana Calahorra-Oliart</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

  <!-- SHARED -->
  <link rel="stylesheet" href="a_styles.css">
  <link rel="stylesheet" href="sidebar.css">

  <style>
    /* ===== BASE (same as your good pages) ===== */
    body {
      margin: 0;
      background-color: #d0e8d0;
      font-family: 'Space Grotesk', sans-serif;
      color: #111;
      margin-left: 180px;
    }

    .content {
      padding: 60px 8vw;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      max-width: 1000px;
      margin: 0 auto 60px auto;
    }

    .hero img {
      width: 100%;
      height: 60vh;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    .hero-text {
      position: absolute;
      bottom: 20px;
      left: 25px;
      color: white;
      background: rgba(0,0,0,0.35);
      padding: 12px 18px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .hero-text h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -1px;
    }

    /* ===== CONTENT ===== */
    .section {
      max-width: 700px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.4rem;
      margin-top: 50px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* ===== VIDEO ===== */
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 20px 0 50px 0;
      padding-top: 56.25%;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 700px) {

      body {
        margin-left: 0;
      }

      .content {
        padding: 20px;
      }

      .hero img {
        height: 40vh;
      }

      .hero-text {
        left: 15px;
        bottom: 15px;
      }

      .hero-text h1 {
        font-size: 1.5rem;
      }

      h2 {
        font-size: 1.2rem;
        margin-top: 30px;
      }

      .video-wrapper {
        margin-bottom: 30px;
      }
    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div id="sidebar"></div>
  <script>
    fetch("sidebar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("sidebar").innerHTML = html;
      });
  </script>

  <!-- CONTENT -->
  <div class="content">

    <!-- HERO -->
    <div class="hero">
      <img src="skatephoto_r.jpg">
      <div class="hero-text">
        <h1>Skateboarding</h1>
      </div>
    </div>

    <!-- TEXT -->
    <div class="section">

      <p>I've been skateboarding since 2003.</p>

      <h2>My videopart</h2>

      <div class="video-wrapper">
        <iframe src="https://www.youtube-nocookie.com/embed/VbYhs36milQ" allowfullscreen></iframe>
      </div>

      <h2>Barcelona Summer 2025</h2>

      <div class="video-wrapper">
        <iframe src="https://www.youtube-nocookie.com/embed/cvqFCiELD1U" allowfullscreen></iframe>
      </div>

    </div>

  </div>

</body>
</html>
