<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adriana Calahorra-Oliart</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

  <!-- SIDEBAR -->
  <link rel="stylesheet" href="sidebar.css">

  <style>
    /* ✅ EXACT SAME BASE AS YOUR WORKING PAGE */
    body {
      margin: 0;
      background-color: #d0e8d0;
      font-family: 'Space Grotesk', sans-serif;
      color: #111;
      margin-left: 180px;
    }

    .content {
      padding: 60px 8vw;
    }

    /* HERO */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
      margin-bottom: 40px;
    }

    .hero img {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
    }

    .hero-text {
      text-align: right;
      max-width: 400px;
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 10px 0;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .subtitle {
      font-family: cursive;
      font-size: 1.5rem;
      letter-spacing: -1px;
    }

    .divider {
      height: 1px;
      background: rgba(0,0,0,0.2);
      margin: 30px 0;
    }

    .bio {
      max-width: 650px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* ===== MOBILE (same logic as your working page) ===== */
    @media (max-width: 700px) {

      body {
        margin-left: 0;
      }

      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-text {
        text-align: center;
      }

      h1 {
        font-size: 2.2rem;
      }

      .subtitle {
        font-size: 1.3rem;
      }

      .content {
        padding: 20px;
      }
    }

  </style>

</head>

<body>

  <!-- SIDEBAR -->
  <div id="sidebar"></div>
  <script>
    fetch("sidebar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("sidebar").innerHTML = html;
      });
  </script>

  <!-- CONTENT -->
  <div class="content">

    <div class="hero">

      <img src="blurry_roses_cropped.jpg" alt="Flowers">

      <div class="hero-text">
        <h1>adriana calahorra-oliart</h1>
        <div class="subtitle">Ph.D. in Evolutionary Biology</div>
      </div>

    </div>

    <div class="divider"></div>

    <div class="bio">
      <p>
        I am fascinated by biological shape and by the evolutionary questions that
        can be addressed with its study. Firm believer that science should be
        applied in creating positive changes in the world, socially and ecologically.
      </p>
    </div>

  </div>

</body>
</html>
