<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adriana Calahorra-Oliart</title>

  <!-- FONTS (unchanged) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

  <!-- SHARED STYLES -->
  <link rel="stylesheet" href="a_styles.css">

  <!-- SIDEBAR -->
  <link rel="stylesheet" href="sidebar.css">

  <style>
    /* ===== ONLY THINGS THAT WERE ALREADY HERE ===== */

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px 8vw;
      gap: 40px;
    }

    .hero img {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      display: block;
    }

    .hero-text {
      text-align: right;
      max-width: 400px;
    }

    .hero-text h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    /* ✅ YOUR ORIGINAL “beautiful cursive” behavior */
    .hero-text .subtitle {
      font-family: cursive;
      font-size: 1.6rem;
    }

    .divider {
      height: 1px;
      background: rgba(0,0,0,0.2);
      margin: 20px 8vw;
    }

    .bio {
      padding: 40px 8vw;
      max-width: 700px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* ===== MOBILE (ONLY RESPONSIVENESS) ===== */
    @media (max-width: 700px) {

      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-text {
        text-align: center;
      }

      .hero-text h1 {
        font-size: 2rem;
      }

      .hero-text .subtitle {
        font-size: 1.3rem;
      }

      .bio {
        padding: 20px;
      }

      .divider {
        margin: 20px;
      }
    }

  </style>

</head>

<body>

  <!-- ✅ FIXED SIDEBAR (same as other pages) -->
  <div id="sidebar"></div>
  <script>
    fetch("sidebar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("sidebar").innerHTML = html;
      });
  </script>

  <!-- CONTENT -->
  <div class="content">

    <section class="hero">

      <img src="blurry_roses_cropped.jpg" alt="Flowers">

      <div class="hero-text">
        <h1>adriana calahorra-oliart</h1>
        <div class="subtitle">Ph.D. in Evolutionary Biology</div>
      </div>

    </section>

    <div class="divider"></div>

    <section class="bio">
      <p>
        I am fascinated by biological shape and by the evolutionary questions that
        can be addressed with its study. Firm believer that science should be
        applied in creating positive changes in the world, socially and ecologically.
      </p>
    </section>

  </div>

</body>
</html>
