<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <style>
    :root {
      --bg-color: #f5f7f6;
      --text-color: #2e2e2e;
      --accent: #2aa198;
      --max-width: 900px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(245, 247, 246, 0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #e0e0e0;
      z-index: 1000;
    }

    .nav-container {
      max-width: var(--max-width);
      margin: auto;
      display: flex;
      justify-content: center;
      padding: 15px 20px;
      gap: 30px;
    }

    .nav-container a {
      text-decoration: none;
      color: #1f3a5f;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: color 0.2s ease;
    }

    .nav-container a:hover {
      color: var(--accent);
    }

    .nav-container a.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* CONTENT */
    .container {
      max-width: var(--max-width);
      margin: auto;
      padding: 140px 20px 60px;
      text-align: center;
    }

    .hola {
      font-size: 3.5rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .hola {
        font-size: 2.5rem;
      }
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="biogeo.html">Main</a>
      <a href="biogeo_team.html">Team</a>
      <a href="biogeo_publications.html">Publications</a>
      <a href="biogeo_contact.html" class="active">Contact</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="container">
    <div class="hola">HOLA!</div>
  </div>

</body>
</html>
