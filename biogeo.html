<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio de Biogeografía</title>

  <style>
    :root {
      --bg-color: #f5f7f6; /* off-white */
      --text-color: #2e2e2e; /* soft dark */
      --accent: #2aa198; /* aqua-green */
      --max-width: 1000px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(245, 247, 246, 0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #e0e0e0;
      z-index: 1000;
    }

    .nav-container {
      max-width: var(--max-width);
      margin: auto;
      display: flex;
      justify-content: center;
      padding: 15px 20px;
      gap: 20px;
    }

    .nav-container a {
      text-decoration: none;
      color: var(--text-color);
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-container a:hover {
      color: var(--accent);
    }

    /* MAIN CONTENT */
    .container {
  max-width: var(--max-width);
  margin: auto;
  padding: 120px 20px 60px;
  text-align: center; /* this also helps consistency */
}

    h1 {
      font-size: 4.5rem;
      color: var(--accent);
      margin-bottom: 30px;
      text-align: center;
    }

    /* BANNER */
    .banner {
      width: 100%;
      height: 250px;
      background-color: #ddd;
      border-radius: 12px;
      overflow: hidden;
      margin: 0 auto 30px auto; /* centers + spacing */
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

p {
  font-size: 1.1rem;
  max-width: 700px;
  margin: 0 auto;        /* centers the block */
  text-align: center;    /* centers the text */
}

    /* MOBILE */
    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .nav-container {
        justify-content: center;
        gap: 15px;
        font-size: 0.9rem;
      }

      .banner {
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#">Main</a>
      <a href="#">Team</a>
      <a href="#">Publications</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="container">

    <h1>Laboratorio de Biogeografía</h1>

    <!-- BANNER IMAGE -->
    <div class="banner">
      <!-- Replace banner.jpg with your image file -->
      <img src="paisaje_chido.png" alt="Banner del laboratorio">
    </div>

    <p>
      Laboratorio centrado en el análisis de la distribución de especies a múltiples escalas espaciales y temporales.
    </p>

  </div>

</body>
</html>
